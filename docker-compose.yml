services:
  web:
    image: php:8.3-apache
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: saas_admin
      DB_USER: app
      DB_PASS: app
    depends_on:
      - db
    command: >
      bash -c "docker-php-ext-install pdo_mysql > /dev/null 2>&1; apache2-foreground"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saas_admin
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
